<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grafo del Proyecto</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

    <script
        src="https://unpkg.com/cytoscape/dist/cytoscape.min.js">
    </script>
</head>

<body>

    <!-- ==================================================
         BARRA SUPERIOR
         ================================================== -->

    <div id="topbar">

        <input
            id="search"
            type="text"
            placeholder="Buscar archivo..."
            autocomplete="off"
        >

        <div id="graph-stats">
            Cargando proyecto...
        </div>

        <div id="top-actions">

            <a
                id="export-summary"
                class="top-button"
                href="/summary.txt"
            >
                📄 Resumen TXT
            </a>

        </div>

    </div>


    <!-- ==================================================
         CONTENIDO PRINCIPAL
         ================================================== -->

    <div id="main">


        <!-- ==============================================
             LISTA IZQUIERDA DE NODOS
             ============================================== -->

        <aside id="nodes-panel">

            <div id="nodes-panel-header">

                <div class="nodes-title-row">

                    <h2>Archivos</h2>

                    <span id="nodes-counter">
                        0
                    </span>

                </div>


                <div class="visibility-buttons">

                    <button
                        id="show-all"
                        type="button"
                        title="Mostrar todos los nodos"
                    >
                        👁 Mostrar todo
                    </button>

                    <button
                        id="hide-all"
                        type="button"
                        title="Ocultar todos los nodos"
                    >
                        🚫 Ocultar todo
                    </button>

                </div>

            </div>


            <div id="nodes-list">

                Cargando archivos...

            </div>

        </aside>


        <!-- ==============================================
             ÁREA DEL GRAFO
             ============================================== -->

        <div id="graph-wrapper">

            <div id="graph"></div>


            <!-- CONTROLES DEL GRAFO -->

            <div id="graph-controls">

                <button
                    id="zoom-in"
                    title="Acercar"
                >
                    +
                </button>

                <button
                    id="zoom-out"
                    title="Alejar"
                >
                    −
                </button>

                <button
                    id="fit-graph"
                    class="wide-control"
                    title="Mostrar todos los nodos visibles"
                >
                    Ajustar
                </button>

                <button
                    id="relayout-graph"
                    class="wide-control"
                    title="Reorganizar nodos visibles"
                >
                    Reordenar
                </button>

            </div>


            <div id="graph-hint">
                Dos dedos: mover · Pellizco/Ctrl+rueda: zoom
            </div>

        </div>


        <!-- ==============================================
             REDIMENSIONADOR DERECHO
             ============================================== -->

        <div
            id="sidebar-resizer"
            title="Arrastra para cambiar el ancho del panel"
        ></div>


        <!-- ==============================================
             PANEL DERECHO
             ============================================== -->

        <aside id="sidebar">

            <h2>Información</h2>

            <div id="info">
                Seleccione un nodo.
            </div>

        </aside>

    </div>


    <script src="/static/app.js"></script>

</body>

</html>
