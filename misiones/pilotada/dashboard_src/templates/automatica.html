<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>SafeVision · Misión Automática</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css', v='automatica-v1') }}"
    >
</head>


<body>

<header class="topbar">

    <div>
        <h1>SafeVision</h1>

        <span>
            Misión Automática
        </span>
    </div>

    <a
        class="dashboard-tab dashboard-tab-link"
        href="/"
    >
        ← Menú
    </a>

</header>


<section class="auto-layout">

    <section class="panel auto-mission-panel">

        <div class="auto-mission-header">

            <div>
                <h2>Robot</h2>

                <span>
                    La conexión se administra desde Misión Pilotada.
                </span>
            </div>

            <span
                id="autoConnectionBadge"
                class="badge badge-off"
            >
                DESCONECTADO
            </span>

        </div>

    </section>

</section>


<section
    id="autoModeView"
    class="workspace auto-layout"
>

    <section class="panel auto-mission-panel">

        <div class="auto-mission-header">

            <div>
                <h2>Misión Automática</h2>

                <span>
                    Selecciona una misión programada.
                </span>
            </div>

            <button
                id="autoMissionRefresh"
                type="button"
            >
                Actualizar
            </button>

        </div>


        <label for="autoMissionSelect">
            Misión
        </label>

        <select id="autoMissionSelect">
            <option value="">
                Cargando misiones...
            </option>
        </select>


        <div class="auto-mission-grid">

            <div class="auto-mission-stat">
                <span>Mapa</span>
                <strong id="autoMissionMap">—</strong>
            </div>

            <div class="auto-mission-stat">
                <span>Punto inicial</span>
                <strong id="autoMissionInitial">—</strong>
            </div>

            <div class="auto-mission-stat">
                <span>Puntos</span>
                <strong id="autoMissionPoints">—</strong>
            </div>

            <div class="auto-mission-stat">
                <span>Acciones</span>
                <strong id="autoMissionActions">—</strong>
            </div>

            <div class="auto-mission-stat">
                <span>Progreso</span>
                <strong id="autoMissionProgress">0 / 0</strong>
            </div>

            <div class="auto-mission-stat">
                <span>Acción actual</span>
                <strong id="autoMissionCurrentAction">—</strong>
            </div>

        </div>


        <label>
            Programa
        </label>

        <pre
            id="autoMissionCode"
            class="auto-mission-code"
        >Selecciona una misión.</pre>


        <div class="auto-mission-footer">

            <button
                id="autoMissionStart"
                type="button"
                disabled
                title="La misión debe estar preparada antes de iniciar."
            >
                Iniciar misión
            </button>

            <button
                id="autoMissionCancel"
                type="button"
                disabled
                title="No hay una misión en ejecución."
            >
                Cancelar
            </button>

            <span
                id="autoMissionStatus"
                class="auto-mission-status"
            >
                Esperando selección.
            </span>

        </div>

    </section>

</section>



<script
    src="{{ url_for('static', filename='automatica.js', v='automatica-v1') }}"
></script>

</body>

</html>
