DWAPlannerROS:
  # 0.0 = crítico lateral completamente desactivado
  lateral_vel_bias: 2.0

  max_vel_x: 0.18
  min_vel_x: 0.00

  max_vel_y: 0.12
  min_vel_y: -0.12

  max_vel_trans: 0.20
  min_vel_trans: 0.02

  max_vel_theta: 0.60
  min_vel_theta: 0.12

  acc_lim_x: 0.50
  acc_lim_y: 0.50
  acc_lim_theta: 1.00

  trans_stopped_vel: 0.04
  theta_stopped_vel: 0.08

  xy_goal_tolerance: 0.08
  yaw_goal_tolerance: 0.12
  latch_xy_goal_tolerance: true

  sim_time: 1.5

  vx_samples: 8
  vy_samples: 5
  vth_samples: 20

  path_distance_bias: 10.0
  goal_distance_bias: 20.0
  occdist_scale: 0.5

  forward_point_distance: 0.15
  stop_time_buffer: 0.20

  scaling_speed: 0.15
  max_scaling_factor: 0.20

  oscillation_reset_dist: 0.05
  oscillation_reset_angle: 0.10

  publish_traj_pc: false
  publish_cost_grid_pc: false

  global_frame_id: map
