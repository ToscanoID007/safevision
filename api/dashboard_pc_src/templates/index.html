<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeVision Dashboard</title>
    <!-- Enlazaremos el CSS más adelante -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>🤖 SafeVision Command Center</h1>
    </header>

    <main class="dashboard-grid">
        <!-- PANEL IZQUIERDO: Configuraciones y Controles -->
        <aside class="control-panel">
            
            <section class="panel-section">
                <h2>🔌 Conexión al Robot</h2>
                <input type="text" id="robot-ip" placeholder="Ej. 192.168.1.100">
                <button id="btn-conectar" onclick="conectarRobot()">Conectar por SSH</button>
                <p id="status-conexion">Estado: Desconectado</p>
            </section>

            <section class="panel-section">
                <h2>🧠 Motor de IA</h2>
                <!-- ¡Aquí está el explorador de archivos que pediste! -->
                <label>Modelo YOLO (.pt):</label>
                <input type="file" id="archivo-pt" accept=".pt">
                
                <label>Etiquetas (.json) [Opcional]:</label>
                <input type="file" id="archivo-json" accept=".json">
                
                <button onclick="subirModelos()">Cargar en Memoria</button>
                
                <label for="confianza">Umbral de Confianza:</label>
                <input type="range" id="confianza" min="0.1" max="1.0" step="0.05" value="0.5" onchange="actualizarConfianza(this.value)">
                <span id="valor-confianza">50%</span>
            </section>

            <section class="panel-section">
                <h2>🎮 Teleoperación</h2>
                <div class="botones-control">
                    <button onclick="enviarComando('teclado')">⌨️ Teclado</button>
                    <button onclick="enviarComando('mando')">🎮 Mando (PS4/Xbox)</button>
                    <button onclick="enviarComando('camara')">📷 Solo Cámara</button>
                    <button class="btn-peligro" onclick="enviarComando('apagar')">🛑 Detener Todo</button>
                </div>
            </section>
        </aside>

        <!-- PANEL DERECHO: Visualización (Video y Mapa) -->
        <section class="visual-panel">
            <div class="video-container">
                <h2>📹 Visión en Tiempo Real</h2>
                <!-- El video procesado por IA aparecerá aquí -->
                <img id="video-stream" src="" alt="Esperando conexión de video..." class="pantalla-negra">
            </div>
            
            <div class="mapa-container">
                <h2>🗺️ Mapeo SLAM</h2>
                <!-- El mapa 2D aparecerá aquí más adelante -->
                <div class="placeholder-mapa">
                    <p>El mapa se renderizará aquí</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Enlazaremos el JS más adelante -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
